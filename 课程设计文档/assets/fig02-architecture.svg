<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790">
  <rect width="1200" height="790" fill="#ffffff"/>
  <defs>
    <marker id="ad" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#555"/></marker>
    <marker id="au" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#999"/></marker>
  </defs>
  <!-- 层间箭头（先画） -->
  <g stroke-width="2.2">
    <line x1="350" y1="160" x2="350" y2="206" stroke="#555" marker-end="url(#ad)"/>
    <line x1="650" y1="210" x2="650" y2="164" stroke="#999" stroke-dasharray="7,5" marker-end="url(#au)"/>
    <line x1="350" y1="320" x2="350" y2="366" stroke="#555" marker-end="url(#ad)"/>
    <line x1="650" y1="370" x2="650" y2="324" stroke="#999" stroke-dasharray="7,5" marker-end="url(#au)"/>
    <line x1="350" y1="480" x2="350" y2="526" stroke="#555" marker-end="url(#ad)"/>
    <line x1="650" y1="530" x2="650" y2="484" stroke="#999" stroke-dasharray="7,5" marker-end="url(#au)"/>
    <line x1="350" y1="640" x2="350" y2="686" stroke="#555" marker-end="url(#ad)"/>
    <line x1="650" y1="690" x2="650" y2="644" stroke="#999" stroke-dasharray="7,5" marker-end="url(#au)"/>
  </g>
  <g font-family="Microsoft YaHei" font-size="15" fill="#444">
    <text x="362" y="190">HTTP 请求（fetch JSON / multipart）</text>
    <text x="662" y="192">JSON 响应</text>
    <text x="362" y="350">调用业务方法</text>
    <text x="662" y="352">返回业务结果</text>
    <text x="362" y="510">调用数据访问方法</text>
    <text x="662" y="512">记录 / 结果集</text>
    <text x="362" y="670">JDBC（参数化 SQL）</text>
    <text x="662" y="672">查询结果</text>
  </g>
  <!-- 表示层 -->
  <rect x="90" y="40" width="1020" height="120" rx="8" fill="#eef3fc" stroke="#3a6ea5" stroke-width="2"/>
  <text x="110" y="72" font-family="Microsoft YaHei" font-size="19" font-weight="bold" fill="#2a4e78">表示层（View）— 浏览器端</text>
  <g font-family="Microsoft YaHei" font-size="15" fill="#1a1a1a">
    <rect x="110" y="85" width="310" height="55" rx="5" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.5"/>
    <text x="265" y="109" text-anchor="middle">HTML 页面：index / forum-main /</text>
    <text x="265" y="130" text-anchor="middle">post / profile / search</text>
    <rect x="440" y="85" width="230" height="55" rx="5" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.5"/>
    <text x="555" y="109" text-anchor="middle">CSS 样式：style.css、</text>
    <text x="555" y="130" text-anchor="middle">forum-ui.css、post.css…</text>
    <rect x="690" y="85" width="400" height="55" rx="5" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.5"/>
    <text x="890" y="109" text-anchor="middle">JavaScript：i18n.js、forum-main.js、post.js…</text>
    <text x="890" y="130" text-anchor="middle">（fetch 发起 AJAX 请求、渲染 DOM）</text>
  </g>
  <!-- 控制层 -->
  <rect x="90" y="210" width="1020" height="110" rx="8" fill="#fdf0f0" stroke="#b04a4a" stroke-width="2"/>
  <text x="110" y="242" font-family="Microsoft YaHei" font-size="19" font-weight="bold" fill="#7a3030">控制层（Controller）— REST API</text>
  <g font-family="Consolas" font-size="14" fill="#1a1a1a">
    <rect x="105" y="255" width="134" height="44" rx="5" fill="#ffffff" stroke="#b04a4a" stroke-width="1.5"/><text x="172" y="282" text-anchor="middle">AuthController</text>
    <rect x="253" y="255" width="134" height="44" rx="5" fill="#ffffff" stroke="#b04a4a" stroke-width="1.5"/><text x="320" y="282" text-anchor="middle">PostController</text>
    <rect x="401" y="255" width="134" height="44" rx="5" fill="#ffffff" stroke="#b04a4a" stroke-width="1.5"/><text x="468" y="282" text-anchor="middle">UserController</text>
    <rect x="549" y="255" width="134" height="44" rx="5" fill="#ffffff" stroke="#b04a4a" stroke-width="1.5"/><text x="616" y="282" text-anchor="middle">BoardController</text>
    <rect x="697" y="255" width="134" height="44" rx="5" fill="#ffffff" stroke="#b04a4a" stroke-width="1.5"/><text x="764" y="282" text-anchor="middle">UploadController</text>
    <rect x="845" y="255" width="134" height="44" rx="5" fill="#ffffff" stroke="#b04a4a" stroke-width="1.5"/><text x="912" y="282" text-anchor="middle">NoticeController</text>
    <rect x="993" y="255" width="100" height="44" rx="5" fill="#ffffff" stroke="#b04a4a" stroke-width="1.5"/><text x="1043" y="276" text-anchor="middle" font-family="Microsoft YaHei">Activity</text><text x="1043" y="294" text-anchor="middle" font-family="Microsoft YaHei">Controller</text>
  </g>
  <!-- 业务逻辑层 -->
  <rect x="90" y="370" width="1020" height="110" rx="8" fill="#eef8ee" stroke="#3f7f3f" stroke-width="2"/>
  <text x="110" y="402" font-family="Microsoft YaHei" font-size="19" font-weight="bold" fill="#2a5a2a">业务逻辑层（Service / Model）</text>
  <g font-family="Microsoft YaHei" font-size="15" fill="#1a1a1a">
    <rect x="110" y="415" width="290" height="50" rx="5" fill="#ffffff" stroke="#3f7f3f" stroke-width="1.5"/>
    <text x="255" y="445" text-anchor="middle">AuthService：注册校验 / 登录认证</text>
    <rect x="420" y="415" width="290" height="50" rx="5" fill="#ffffff" stroke="#3f7f3f" stroke-width="1.5"/>
    <text x="565" y="445" text-anchor="middle">UploadFileCleaner：旧文件清理</text>
    <rect x="730" y="415" width="360" height="50" rx="5" fill="#ffffff" stroke="#3f7f3f" stroke-width="1.5"/>
    <text x="910" y="438" text-anchor="middle">Model：User、Post、SearchResult（record）</text>
    <text x="910" y="458" text-anchor="middle">业务数据模型贯穿各层</text>
  </g>
  <!-- 数据访问层 -->
  <rect x="90" y="530" width="1020" height="110" rx="8" fill="#f5f0fb" stroke="#6b4fa0" stroke-width="2"/>
  <text x="110" y="562" font-family="Microsoft YaHei" font-size="19" font-weight="bold" fill="#4a3572">数据访问层（Repository）— Spring JDBC</text>
  <g font-family="Consolas" font-size="14" fill="#1a1a1a">
    <rect x="110" y="575" width="220" height="44" rx="5" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.5"/><text x="220" y="602" text-anchor="middle">UserRepository</text>
    <rect x="350" y="575" width="220" height="44" rx="5" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.5"/><text x="460" y="602" text-anchor="middle">PostRepository</text>
    <rect x="590" y="575" width="220" height="44" rx="5" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.5"/><text x="700" y="602" text-anchor="middle">BoardRepository</text>
    <rect x="830" y="575" width="220" height="44" rx="5" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.5"/><text x="940" y="602" text-anchor="middle">NoticeRepository</text>
  </g>
  <!-- 数据库 -->
  <rect x="90" y="690" width="1020" height="80" rx="8" fill="#ececec" stroke="#555555" stroke-width="2"/>
  <text x="600" y="724" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#333">MySQL 数据库 campus_tieba</text>
  <text x="600" y="750" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" fill="#555">users / boards / posts / replies / user_likes / reply_likes / user_favorites / user_follows / browsing_history / board_moderators / site_notice</text>
</svg>
