<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" width="1240" height="650">
  <rect width="1240" height="650" fill="#ffffff"/>
  <defs>
    <marker id="arp" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#555"/></marker>
  </defs>
  <!-- 参与者 -->
  <g font-family="Microsoft YaHei" font-size="15.5" font-weight="bold" text-anchor="middle">
    <rect x="55" y="20" width="150" height="46" rx="6" fill="#eef3fc" stroke="#3a6ea5" stroke-width="2"/><text x="130" y="49">用户浏览器</text>
    <rect x="245" y="20" width="180" height="46" rx="6" fill="#fdf2e7" stroke="#b07a2a" stroke-width="2"/><text x="335" y="49">UploadController</text>
    <rect x="445" y="20" width="170" height="46" rx="6" fill="#fdf0f0" stroke="#b04a4a" stroke-width="2"/><text x="530" y="49">PostController</text>
    <rect x="635" y="20" width="180" height="46" rx="6" fill="#eef8ee" stroke="#3f7f3f" stroke-width="2"/><text x="725" y="49">UserRepository</text>
    <rect x="825" y="20" width="180" height="46" rx="6" fill="#f5f0fb" stroke="#6b4fa0" stroke-width="2"/><text x="915" y="49">PostRepository</text>
    <rect x="1025" y="20" width="150" height="46" rx="6" fill="#ececec" stroke="#555" stroke-width="2"/><text x="1100" y="49">MySQL</text>
  </g>
  <!-- 生命线 -->
  <g stroke="#b8b8c0" stroke-width="1.5" stroke-dasharray="6,6">
    <line x1="130" y1="66" x2="130" y2="540"/>
    <line x1="335" y1="66" x2="335" y2="540"/>
    <line x1="530" y1="66" x2="530" y2="540"/>
    <line x1="725" y1="66" x2="725" y2="540"/>
    <line x1="915" y1="66" x2="915" y2="540"/>
    <line x1="1100" y1="66" x2="1100" y2="540"/>
  </g>
  <!-- 消息 -->
  <g stroke="#555" stroke-width="2" font-family="Microsoft YaHei" font-size="14.5" fill="#1a1a1a">
    <line x1="130" y1="115" x2="331" y2="115" marker-end="url(#arp)"/>
    <text x="232" y="105" text-anchor="middle">1. POST /api/upload（multipart 图片）</text>
    <path d="M 335 155 L 385 155 L 385 175 L 339 175" fill="none" marker-end="url(#arp)"/>
    <text x="397" y="170">2. 校验类型/大小，保存到外部上传目录</text>
    <line x1="335" y1="205" x2="134" y2="205" stroke-dasharray="7,5" marker-end="url(#arp)"/>
    <text x="232" y="195" text-anchor="middle">3. 200 {url:"/uploads/post-…png"}</text>
    <line x1="130" y1="255" x2="526" y2="255" marker-end="url(#arp)"/>
    <text x="328" y="245" text-anchor="middle">4. POST /api/posts {userId, board, title, content, imageUrl}</text>
    <line x1="530" y1="300" x2="721" y2="300" marker-end="url(#arp)"/>
    <text x="625" y="290" text-anchor="middle">5. findById(userId)</text>
    <line x1="725" y1="333" x2="534" y2="333" stroke-dasharray="7,5" marker-end="url(#arp)"/>
    <text x="630" y="323" text-anchor="middle">6. User / null（封禁校验）</text>
    <line x1="530" y1="373" x2="911" y2="373" marker-end="url(#arp)"/>
    <text x="720" y="363" text-anchor="middle">7. insert(userId, board, title, content, imageUrl)</text>
    <line x1="915" y1="413" x2="1096" y2="413" marker-end="url(#arp)"/>
    <text x="1007" y="403" text-anchor="middle">8. INSERT INTO posts (…)</text>
    <line x1="1100" y1="446" x2="919" y2="446" stroke-dasharray="7,5" marker-end="url(#arp)"/>
    <text x="1010" y="436" text-anchor="middle">9. affected rows = 1</text>
    <line x1="915" y1="486" x2="534" y2="486" stroke-dasharray="7,5" marker-end="url(#arp)"/>
    <text x="725" y="476" text-anchor="middle">10. 新帖子 id</text>
    <line x1="530" y1="528" x2="134" y2="528" stroke-dasharray="7,5" marker-end="url(#arp)"/>
    <text x="328" y="518" text-anchor="middle">11. 200 {message:"发布成功", id}（封禁账号 403）</text>
  </g>
  <rect x="150" y="565" width="940" height="66" rx="6" fill="#fffbe8" stroke="#d9b44a" stroke-width="1.5"/>
  <text x="620" y="588" text-anchor="middle" font-family="Microsoft YaHei" font-size="14" fill="#6a5a1a">发布成功后前端刷新当前版面信息流；图片经独立上传接口先上传，帖子只保存 URL；</text>
  <text x="620" y="612" text-anchor="middle" font-family="Microsoft YaHei" font-size="14" fill="#6a5a1a">编辑帖子更换图片时，数据库更新成功后由 UploadFileCleaner 删除被替换的旧图片文件</text>
</svg>
