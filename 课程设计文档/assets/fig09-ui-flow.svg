<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" width="1400" height="680">
  <rect width="1400" height="680" fill="#ffffff"/>
  <defs>
    <marker id="nav" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#555"/></marker>
  </defs>
  <text x="700" y="42" text-anchor="middle" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#333">校园贴吧系统界面跳转关系图</text>
  <!-- 连线 -->
  <g stroke="#8888a0" stroke-width="2" font-family="Microsoft YaHei" font-size="14" fill="#333">
    <line x1="300" y1="335" x2="456" y2="335" marker-end="url(#nav)"/>
    <text x="378" y="325" text-anchor="middle">登录 / 注册成功</text>
    <line x1="460" y1="385" x2="304" y2="385" marker-end="url(#nav)"/>
    <text x="382" y="408" text-anchor="middle">退出登录</text>
    <line x1="760" y1="295" x2="1016" y2="155" marker-end="url(#nav)"/>
    <text x="900" y="212" text-anchor="middle">点击帖子卡片</text>
    <line x1="1020" y1="190" x2="764" y2="335" marker-end="url(#nav)"/>
    <text x="905" y="290" text-anchor="middle">返回信息流</text>
    <line x1="760" y1="380" x2="1016" y2="372" marker-end="url(#nav)"/>
    <text x="888" y="364" text-anchor="middle">顶部搜索</text>
    <line x1="1020" y1="405" x2="764" y2="412" marker-end="url(#nav)"/>
    <text x="892" y="436" text-anchor="middle">返回</text>
    <line x1="760" y1="430" x2="1016" y2="572" marker-end="url(#nav)"/>
    <text x="880" y="520" text-anchor="middle">点击用户信息</text>
    <line x1="1080" y1="330" x2="1080" y2="194" marker-end="url(#nav)"/>
    <text x="1070" y="270" text-anchor="end">点击帖子结果</text>
    <polyline points="1260,160 1340,160 1340,585 1264,585" fill="none" marker-end="url(#nav)"/>
    <text x="1300" y="150" text-anchor="middle">点击回帖用户</text>
    <polyline points="1260,605 1360,605 1360,130 1264,130" fill="none" marker-end="url(#nav)"/>
    <text x="1310" y="632" text-anchor="middle">查看其帖子</text>
  </g>
  <!-- 页面框 -->
  <g font-family="Microsoft YaHei">
    <rect x="80" y="300" width="220" height="90" rx="8" fill="#eef3fc" stroke="#3a6ea5" stroke-width="2.5"/>
    <text x="190" y="336" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a4e78">登录 / 注册页</text>
    <text x="190" y="362" text-anchor="middle" font-size="14" fill="#1a1a1a">index.html</text>
    <text x="190" y="380" text-anchor="middle" font-size="13" fill="#555">用户/管理员双入口 · 中英文</text>

    <rect x="460" y="270" width="300" height="180" rx="8" fill="#eef8ee" stroke="#3f7f3f" stroke-width="2.5"/>
    <text x="610" y="302" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a5a2a">主页 forum-main.html</text>
    <g font-size="13.5" fill="#1a1a1a">
      <rect x="480" y="316" width="125" height="30" rx="15" fill="#ffffff" stroke="#3f7f3f" stroke-width="1.5"/><text x="542" y="336" text-anchor="middle">信息流视图</text>
      <rect x="615" y="316" width="125" height="30" rx="15" fill="#ffffff" stroke="#3f7f3f" stroke-width="1.5"/><text x="677" y="336" text-anchor="middle">通知视图</text>
      <rect x="480" y="354" width="125" height="30" rx="15" fill="#ffffff" stroke="#3f7f3f" stroke-width="1.5"/><text x="542" y="374" text-anchor="middle">个人中心视图</text>
      <rect x="615" y="354" width="125" height="30" rx="15" fill="#ffffff" stroke="#3f7f3f" stroke-width="1.5"/><text x="677" y="374" text-anchor="middle">发帖编辑弹窗</text>
      <rect x="480" y="392" width="260" height="30" rx="15" fill="#ffffff" stroke="#3f7f3f" stroke-width="1.5"/><text x="610" y="412" text-anchor="middle">设置弹窗：基础设置 · 管理功能</text>
    </g>

    <rect x="1020" y="110" width="240" height="90" rx="8" fill="#fdf0f0" stroke="#b04a4a" stroke-width="2.5"/>
    <text x="1140" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a3030">帖子详情页</text>
    <text x="1140" y="172" text-anchor="middle" font-size="14" fill="#1a1a1a">post.html</text>
    <text x="1140" y="190" text-anchor="middle" font-size="13" fill="#555">回复 · 楼中楼 · 点赞 · 收藏</text>

    <rect x="1020" y="330" width="240" height="90" rx="8" fill="#f5f0fb" stroke="#6b4fa0" stroke-width="2.5"/>
    <text x="1140" y="366" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a3572">搜索结果页</text>
    <text x="1140" y="392" text-anchor="middle" font-size="14" fill="#1a1a1a">search.html</text>
    <text x="1140" y="410" text-anchor="middle" font-size="13" fill="#555">帖子 / 用户关键字分页结果</text>

    <rect x="1020" y="550" width="240" height="90" rx="8" fill="#fdf2e7" stroke="#b07a2a" stroke-width="2.5"/>
    <text x="1140" y="586" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5418">个人主页</text>
    <text x="1140" y="612" text-anchor="middle" font-size="14" fill="#1a1a1a">profile.html</text>
    <text x="1140" y="630" text-anchor="middle" font-size="13" fill="#555">发帖列表 · 获赞统计 · 背景</text>
  </g>
  <text x="700" y="666" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" fill="#666">说明：各页面顶部均提供搜索框与中英文切换；登录状态保存在 sessionStorage，关闭浏览器后自动失效。</text>
</svg>
