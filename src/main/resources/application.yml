server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/plain,text/xml,application/xml
    min-response-size: 1024
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_tieba?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ASDqweasd12}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  sql:
    init:
      mode: never
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 300s
          must-revalidate: true
          cache-public: true

tieba:
  upload-dir: ../tieba-data
logging:
  file:
    name: logs/spring.log
  level:
    com.tieba: DEBUG
    org.springframework.web: DEBUG
